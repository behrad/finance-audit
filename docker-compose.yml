services:
  app:
    build: .
    ports: ["${PORT:-8080}:8080"]
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8081
      DOTENV_PRIVATE_KEY: ${DOTENV_PRIVATE_KEY:-}   # decrypts the baked-in .env; start.sh --docker exports it from .env.keys
    depends_on: [firestore]
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081
    ports: ["8081:8081"]
