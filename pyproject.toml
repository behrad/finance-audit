[project]
name = "receipt-auditor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyyaml>=6",
    "google-adk==2.13.0",
    "litellm>=1.108.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "pillow>=10",
    "rfc3339-validator>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app", "app.payhawk", "app.pipeline"]
